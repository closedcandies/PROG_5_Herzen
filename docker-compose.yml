# Для локальной разработки используйте: docker compose -f docker-compose.local.yml up
# Для dev сервера используйте: docker compose -f docker-compose.dev.yml up

services:

  app:
    build: .
    container_name: app
    expose:
      - "8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis
    volumes:
      - ./app:/app/app
      - ./static:/app/static
    networks:
      - app_network  

  frontend:
    build:
      context: ../mentorAI_front
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - API_URL=http://nginx/api
      - NODE_ENV=production
    networks:
      - app_network

  nginx:
    image: nginx:1.25-alpine
    container_name: nginx
    restart: unless-stopped
    depends_on:
      - app
      - frontend
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d.local:/etc/nginx/conf.d:ro
      - ./static:/app/static:ro
    networks:
      - app_network

  db:
    image: postgres:15
    container_name: db
    restart: always
    environment:
      POSTGRES_DB: ${DATABASE__db}
      POSTGRES_USER: ${DATABASE__user}
      POSTGRES_PASSWORD: ${DATABASE__password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
  
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --requirepass ${REDIS__PASSWORD}
    environment:
      - REDIS__PASSWORD=$${REDIS__PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$$REDIS__PASSWORD", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
